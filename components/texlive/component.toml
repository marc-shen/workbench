schema = 1
name = "texlive"
description = "TeX Live 排版环境（macOS 使用 MacTeX）"
category = "latex"
tags = ["typesetting"]
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
requires = []
entrypoint = ["{python}", "{repo}/libexec/component.py", "texlive"]
arguments = ""

[actions]

[actions.list]
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
description = "列出安装状态"

[actions.check]
description = "验证命令可运行"

[actions.install]
description = "补齐缺失安装"

[actions.update]
description = "显式更新版本"

[actions.offer]
description = "全部安装和检查完成后询问是否安装 MacTeX，可跳过"
platforms = ["macos"]

[install]
kind = "texlive"
provider = "upstream"

[install.macos]
package_url = "https://mirror.ctan.org/systems/mac/mactex/MacTeX.pkg"
checksum_url = "https://mirror.ctan.org/systems/mac/mactex/MacTeX.pkg.sha512"
