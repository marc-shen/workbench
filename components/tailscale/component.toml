schema = 1
name = "tailscale"
description = "tailscale 网络服务"
category = "network"
tags = ["service"]
platforms = ["macos", "steamdeck"]
requires = []
entrypoint = ["{python}", "{repo}/libexec/component.py", "tailscale"]
arguments = ""

[actions]

[actions.list]
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
description = "列出对象与本机状态"

[actions.check]
description = "检查配置和安装状态"

[actions.install]
description = "补齐缺失项目，保留已有安装"

[actions.install.options]
"--mode=personal" = "macOS 个人使用：官网图形版（新机默认）"
"--mode=server" = "macOS 服务器：tailscaled 系统服务"

[actions.update]
description = "显式更新已选择的项目"

[actions.apply]
description = "首次授权并启用所选客户端"

[actions.start]
description = "启动后台"

[actions.stop]
description = "停止后台"

[actions.restart]
description = "重启后台"

[actions.status]
description = "查看后台状态"

[actions.logs]
description = "查看日志"

[actions.open]
description = "打开客户端或网页"

[actions.show]
description = "查看实际 DNS、子网路由与出口节点设置（只读）"

[actions.set]
description = "设置 DNS、子网路由、提供出口或使用出口节点"
arguments = ""

[actions.set.options]
"--accept-dns=false" = "关闭接受 Tailscale DNS（默认）"
"--accept-dns=true" = "接受 Tailscale DNS 配置"
"--accept-routes=false" = "不接受其他设备发布的子网路由"
"--accept-routes=true" = "接受子网路由，无需使用出口节点"
"--advertise-exit-node=false" = "不提供出口节点（默认）"
"--advertise-exit-node=true" = "让本机提供出口节点"
"--exit-node=false" = "不使用其他出口节点（默认）"
"--exit-node=" = "使用指定出口节点，填写 IP 或名称"

[settings.defaults]
accept-dns = false
advertise-exit-node = false
exit-node = false

[install]
kind = "network"
provider = "upstream"
service = "tailscale"

[install.source]
repository = "https://github.com/tailscale-dev/deck-tailscale.git"
revision = "4691bb20d492ae9b2f5121c3eaf6e2dc1950e73f"

[install.macos]
formula = "tailscale"
service = "sh.brew.tailscale"
legacy_services = ["homebrew.mxcl.tailscale"]
